# Builds the web version and deploys it to Vercel (dayloom-int.vercel.app)
# on every push to main. Can also be run by hand from the Actions tab.
#
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN  an access token from https://vercel.com/account/tokens
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces an in-progress deploy instead of racing it.
concurrency:
  group: web-deploy
  cancel-in-progress: true

env:
  # These identify the dayloom-int project. They aren't secret.
  VERCEL_ORG_ID: team_Wku9AxkhpKTINifvpBxfMMgo
  VERCEL_PROJECT_ID: prj_ggwnyDVGGluESmIYFn8s36sABPt9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. See 'Build and share the web version' in the README."
            exit 1
          fi
          npx --yes vercel@65.2.0 deploy build/web --prod --yes --token="$VERCEL_TOKEN"
